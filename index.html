<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hix demo</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <script src="wasm_exec.js"></script>
  <script src="pako.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="sandbox" class="sandbox"></div>
  <script>
    // main.wasm.gz is unpacked here so it works the same on any static host.
    const go = new Go();
    fetch("main.wasm.gz")
      .then((res) => res.arrayBuffer())
      .then((buf) => WebAssembly.instantiate(pako.ungzip(new Uint8Array(buf)).buffer, go.importObject))
      .then((result) => go.run(result.instance))
      .catch((err) => console.error("Error loading WASM:", err));
  </script>
</body>
</html>
